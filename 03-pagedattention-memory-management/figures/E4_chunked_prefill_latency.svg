<svg xmlns="http://www.w3.org/2000/svg" width="960" height="795" viewBox="0 0 960 795" role="img" aria-labelledby="title desc">
<title id="title">E4 Chunked Prefill — P99 ITL and P99 TTFT by token budget</title>
<desc id="desc">Four measured budgets: 512, 1024, 2048, 4096. Short P99 ITL 258.92, 420.25, 422.93, 85.57 milliseconds. Short P99 TTFT 14.37, 14.63, 15.14, 15.47 seconds. Long P99 TTFT 14.61, 14.74, 14.40, 15.34 seconds. One experiment per budget.</desc>
