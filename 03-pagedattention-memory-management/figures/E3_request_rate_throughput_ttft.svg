<svg xmlns="http://www.w3.org/2000/svg" width="940" height="590" viewBox="0 0 940 590" role="img" aria-labelledby="title desc"><title id="title">E3 Request rate vs output throughput and P99 TTFT</title><desc id="desc">Means of two independent 16-condition runs and four sequence limits. The P99 TTFT here is the average of per-run P99s, not pooled percentile.</desc><rect width="940" height="590" rx="20" fill="#fff"/><text x="45" y="45" font-family="Arial" fill="#172b4d" font-size="25" font-weight="bold">E3 | Continuous Batching</text><text x="45" y="74" font-family="Arial" fill="#64748b" font-size="15">Mean across 2 runs × 4 sequence limits at each request rate</text><text x="45" y="112" font-family="Arial" fill="#172b4d" font-size="19" font-weight="bold">Output throughput (tokens/s)</text><line x1="80" x2="830" y1="268" y2="268" stroke="#94a3b8"/><polyline points="100,236.7 340,208.7 580,162.5 820,118.7" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="100" cy="236.7" r="6" fill="#2563eb"/><text x="100" y="224.7" text-anchor="middle" font-size="13" fill="#2563eb" font-weight="bold">246.3</text><circle cx="340" cy="208.7" r="6" fill="#2563eb"/><text x="340" y="196.7" text-anchor="middle" font-size="13" fill="#2563eb" font-weight="bold">467.6</text><circle cx="580" cy="162.5" r="6" fill="#2563eb"/><text x="580" y="150.5" text-anchor="middle" font-size="13" fill="#2563eb" font-weight="bold">830.9</text><circle cx="820" cy="118.7" r="6" fill="#2563eb"/><text x="820" y="106.7" text-anchor="middle" font-size="13" fill="#2563eb" font-weight="bold">1176</text><text x="45" y="331" font-family="Arial" fill="#172b4d" font-size="19" font-weight="bold">Mean of P99 TTFT values (ms)</text><line x1="80" x2="830" y1="510" y2="510" stroke="#94a3b8"/><polyline points="100,497.0 340,496.9 580,492.1 820,369.2" fill="none" stroke="#dc6536" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="100" cy="497.0" r="6" fill="#dc6536"/><text x="100" y="485.0" text-anchor="middle" font-size="13" fill="#dc6536" font-weight="bold">94.8</text><circle cx="340" cy="496.9" r="6" fill="#dc6536"/><text x="340" y="484.9" text-anchor="middle" font-size="13" fill="#dc6536" font-weight="bold">95.4</text><circle cx="580" cy="492.1" r="6" fill="#dc6536"/><text x="580" y="480.1" text-anchor="middle" font-size="13" fill="#dc6536" font-weight="bold">130.3</text><circle cx="820" cy="369.2" r="6" fill="#dc6536"/><text x="820" y="357.2" text-anchor="middle" font-size="13" fill="#dc6536" font-weight="bold">1024</text><text x="100" y="538" text-anchor="middle" font-size="14" fill="#64748b">1</text><text x="340" y="538" text-anchor="middle" font-size="14" fill="#64748b">2</text><text x="580" y="538" text-anchor="middle" font-size="14" fill="#64748b">4</text><text x="820" y="538" text-anchor="middle" font-size="14" fill="#64748b">8</text><text x="455" y="570" text-anchor="middle" font-family="Arial" font-size="15" fill="#64748b">Request arrival rate (requests/s)</text></svg>